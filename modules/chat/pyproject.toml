[project]
name = "chat"
version = "0.1.0"
description = "Turn execution: runs the LangGraph workflow for one chat turn and streams the answer, with one cached AgentService runtime per agent-definition version."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "agent",
    "graph",
    "artifact",
    "authentication",
    "session",
]

# `shared` and `infrastructure` are importable via the workspace's single
# environment - see modules/agent/pyproject.toml for the same note.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat"]
