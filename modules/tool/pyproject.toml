[project]
name = "tool"
version = "0.1.0"
description = "Local tool registry and @mcp_tool decorator for agent-callable tools."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9",
    "pydantic>=2.9",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "artifact",
]

# `shared` is importable via the workspace's single environment - see
# modules/agent/pyproject.toml for the same note.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool"]
