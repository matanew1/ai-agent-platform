# Every external MCP server this app connects to - one top-level key per
# server, each with a `command` (required) and `args` (optional). Add a
# new server by adding another key here; nothing else changes -
# tool/adapters/mcp/config.py::load_servers() registers every entry in this file,
# and app/lifespan.py registers every server load_servers() returns. See
# .claude/rules/tool-conventions.md.
#
# `--with mcp==1.9.4` appears in every entry below, and that is not
# copy-paste inertia: all four official servers tried here so far (fetch,
# time, sqlite, git) are published against an older mcp SDK API than uvx
# resolves by default, and every one of them crashes on startup without
# the pin - `ImportError: cannot import name 'McpError'` for fetch/time,
# `AttributeError: 'Server' object has no attribute 'list_tools'` for
# sqlite/git. Assume a new server needs it too; check with a plain
# `uvx <package> --help` first, which reproduces the crash outside this app.

fetch:
  # The official Fetch MCP server: fetches a URL and returns its content
  # as text. Run via `uvx` (bundled with `uv`, already this project's
  # toolchain) - no Node/npm dependency, unlike some other official MCP
  # servers.
  #
  # --with mcp==1.9.4 pins the *subprocess's own* mcp SDK install, separate
  # from this project's own (newer) mcp client dependency - mcp-server-fetch
  # (as currently published on PyPI) breaks under uvx's default resolution
  # because it imports `McpError`, a name a newer mcp release replaced with
  # `MCPError`; confirmed by reproducing the failure with plain
  # `uvx mcp-server-fetch --help`. Client and server only talk over
  # stdio/JSON-RPC, so their mcp package versions don't need to match -
  # only the subprocess's own install needs one new enough to have
  # `McpError`.
  command: /opt/homebrew/bin/uvx
  args: ["--with", "mcp==1.9.4", "mcp-server-fetch"]
  # mcp-server-fetch's optional Readability.js path runs ``npm install`` on
  # first use. Its child inherits the MCP process's stdout and corrupts the
  # newline-delimited JSON-RPC stream with npm progress messages. Hiding
  # Node/npm from this server's PATH makes it use its reliable Python-only
  # extractor instead. StdioServerParameters merges this over the normal
  # inherited environment. Use uvx's absolute macOS path because the narrowed
  # PATH intentionally cannot resolve it.
  env:
    PATH: "/usr/bin:/bin"
  #
  # Worth knowing, since it looks like a broken tool and isn't: this server
  # defaults to `raw: false`, converting the page to markdown - and that
  # conversion drops <head>, so the page <title> never reaches the agent.
  # Asked for a title, the agent can only answer "the title could not be
  # extracted". That default is kept on purpose: markdown is what makes the
  # tool good at questions *about page content*. Measured on the same page
  # (https://ynet.co.il), same max_length:
  #
  #   raw: false ->  5,136 chars, no title, 260 readable words
  #   raw: true  ->  5,237 chars, title,      8 readable words
  #
  # Raw HTML spends the max_length budget on <head>/<script> boilerplate
  # before reaching any prose. So: leave this alone, and just ask for raw
  # on the turns that need markup - the agent passes `raw: true` itself
  # when the request calls for it (verified: it returns the exact <title>).

time:
  # Wall-clock and timezone reasoning - the one dimension an LLM cannot
  # fake, since it has no clock and its training cutoff is not "now".
  # Exposes get_current_time and convert_time.
  #
  # No arguments, no filesystem, no network: it computes from the host
  # clock and the tz database, so there is nothing here to lock down.
  # --local-timezone can pin a default (e.g. Asia/Jerusalem) if the host's
  # own zone isn't the one you want tools to assume; left off so it
  # follows the machine.
  command: uvx
  args: ["--with", "mcp==1.9.4", "mcp-server-time"]

tavily:
  # Web search, replacing the earlier `duckduckgo` (ddg-mcp) entry. ddg-mcp
  # was community/unofficial and this repo's own measured accuracy table
  # (tool-conventions.md) showed its search tool selected 0/3 even on an
  # explicit "search the web for..." prompt, while also dragging
  # get_current_time down from 3/3 to 1/3 - the worst numbers of anything
  # measured in this file. Tavily is built specifically for LLM/agent
  # consumption (pre-summarized, structured results, not scraped HTML) and
  # is an official, actively maintained package - worth the tradeoff of
  # needing an API key where ddg-mcp needed none.
  #
  # Freemium: free tier is 1,000 searches/month, no payment details needed
  # to obtain a key at https://app.tavily.com. Node/npm package, like
  # `filesystem` below - no Python equivalent, so no `--with mcp==1.9.4`
  # pin applies here (that gotcha is specific to the Python servers above).
  #
  # TAVILY_API_KEY is a secret and does not live in this file - it's read
  # from the process environment (.env.dev/.env.prod) via the ${VAR_NAME}
  # syntax `tool/adapters/mcp/config.py::_resolve_env` substitutes at load
  # time. Set TAVILY_API_KEY there before this server will start.
  #
  # Accuracy not yet measured against this repo's standard 3-trial table -
  # see tool-conventions.md "Servers evaluated" for the pending entry.
  command: npx
  args: ["-y", "tavily-mcp@latest"]
  env:
    TAVILY_API_KEY: "${TAVILY_API_KEY}"

filesystem:
  # The official Filesystem MCP server: read_file, read_multiple_files,
  # list_directory, directory_tree, search_files, get_file_info, plus
  # WRITE tools - write_file, edit_file, create_directory, move_file. Unlike
  # every other server in this file it's an npm package, not a uvx/PyPI one
  # (no Python equivalent exists), so it needs Node/npx instead of the
  # `--with mcp==1.9.4` uvx pin the others need - sanity-checked live and it
  # starts clean under the current npx/mcp SDK versions, no pin required.
  #
  # This is the same fetch-pairs-with-a-mutating-tool risk
  # .claude/rules/tool-conventions.md declined `git` and `workos` for:
  # `fetch` already pipes attacker-controlled web text into the model's
  # prompt, and this server's write tools give a prompt-injected turn a
  # path to write local files. There's no read-only flag to make the write
  # tools disappear from what's registered - the actual mitigation here is
  # the scoped directory below being a dedicated, empty, throwaway folder
  # with nothing of value in it, not tool filtering. Do not repoint this at
  # the repo, $HOME, or anything containing real data.
  #
  # The directory is a required env var, not a literal path, for the same
  # reason TAVILY_API_KEY above is: this file is committed and shared by
  # every clone, and a directory that's the sole boundary around a
  # write-capable, prompt-injection-reachable tool must not be one
  # developer's home-folder layout baked into it. `config.py::load_servers`
  # resolves `${VAR_NAME}` in `args` the same way it already does for `env`
  # values - an unset AGENT_FILES_DIR skips just this server, same as a
  # missing TAVILY_API_KEY skips just `tavily`. Set AGENT_FILES_DIR in
  # .env.dev/.env.prod to a dedicated, empty, throwaway directory before
  # this server will start.
  command: npx
  args: ["-y", "@modelcontextprotocol/server-filesystem", "${AGENT_FILES_DIR}"]

# Two more servers were evaluated here and deliberately not enabled -
# sqlite (structured data) and git (repo awareness). Both connect fine and
# both answer real calls; the reasons they're off are measured, not
# assumed. See .claude/rules/tool-conventions.md ("Servers evaluated and
# not enabled") for the numbers and the exact args to turn either on.
