# Every external MCP server this app connects to - one top-level key per
# server, each with a `command` (required) and `args` (optional). Add a
# new server by adding another key here; nothing else changes -
# tool/adapters/mcp/config.py::load_servers() registers every entry in this file,
# and app/lifespan.py registers every server load_servers() returns. See
# .claude/rules/tool-conventions.md.
#
# `--with mcp==1.9.4` appears in every entry below, and that is not
# copy-paste inertia: all four official servers tried here so far (fetch,
# time, sqlite, git) are published against an older mcp SDK API than uvx
# resolves by default, and every one of them crashes on startup without
# the pin - `ImportError: cannot import name 'McpError'` for fetch/time,
# `AttributeError: 'Server' object has no attribute 'list_tools'` for
# sqlite/git. Assume a new server needs it too; check with a plain
# `uvx <package> --help` first, which reproduces the crash outside this app.

fetch:
  # The official Fetch MCP server: fetches a URL and returns its content
  # as text. Run via `uvx` (bundled with `uv`, already this project's
  # toolchain) - no Node/npm dependency, unlike some other official MCP
  # servers.
  #
  # --with mcp==1.9.4 pins the *subprocess's own* mcp SDK install, separate
  # from this project's own (newer) mcp client dependency - mcp-server-fetch
  # (as currently published on PyPI) breaks under uvx's default resolution
  # because it imports `McpError`, a name a newer mcp release replaced with
  # `MCPError`; confirmed by reproducing the failure with plain
  # `uvx mcp-server-fetch --help`. Client and server only talk over
  # stdio/JSON-RPC, so their mcp package versions don't need to match -
  # only the subprocess's own install needs one new enough to have
  # `McpError`.
  command: /opt/homebrew/bin/uvx
  args: ["--with", "mcp==1.9.4", "mcp-server-fetch"]
  # mcp-server-fetch's optional Readability.js path runs ``npm install`` on
  # first use. Its child inherits the MCP process's stdout and corrupts the
  # newline-delimited JSON-RPC stream with npm progress messages. Hiding
  # Node/npm from this server's PATH makes it use its reliable Python-only
  # extractor instead. StdioServerParameters merges this over the normal
  # inherited environment. Use uvx's absolute macOS path because the narrowed
  # PATH intentionally cannot resolve it.
  env:
    PATH: "/usr/bin:/bin"
  #
  # Worth knowing, since it looks like a broken tool and isn't: this server
  # defaults to `raw: false`, converting the page to markdown - and that
  # conversion drops <head>, so the page <title> never reaches the agent.
  # Asked for a title, the agent can only answer "the title could not be
  # extracted". That default is kept on purpose: markdown is what makes the
  # tool good at questions *about page content*. Measured on the same page
  # (https://ynet.co.il), same max_length:
  #
  #   raw: false ->  5,136 chars, no title, 260 readable words
  #   raw: true  ->  5,237 chars, title,      8 readable words
  #
  # Raw HTML spends the max_length budget on <head>/<script> boilerplate
  # before reaching any prose. So: leave this alone, and just ask for raw
  # on the turns that need markup - the agent passes `raw: true` itself
  # when the request calls for it (verified: it returns the exact <title>).

time:
  # Wall-clock and timezone reasoning - the one dimension an LLM cannot
  # fake, since it has no clock and its training cutoff is not "now".
  # Exposes get_current_time and convert_time.
  #
  # No arguments, no filesystem, no network: it computes from the host
  # clock and the tz database, so there is nothing here to lock down.
  # --local-timezone can pin a default (e.g. Asia/Jerusalem) if the host's
  # own zone isn't the one you want tools to assume; left off so it
  # follows the machine.
  command: uvx
  args: ["--with", "mcp==1.9.4", "mcp-server-time"]

tavily:
  # Web search, replacing the earlier `duckduckgo` (ddg-mcp) entry. ddg-mcp
  # was community/unofficial and this repo's own measured accuracy table
  # (tool-conventions.md) showed its search tool selected 0/3 even on an
  # explicit "search the web for..." prompt, while also dragging
  # get_current_time down from 3/3 to 1/3 - the worst numbers of anything
  # measured in this file. Tavily is built specifically for LLM/agent
  # consumption (pre-summarized, structured results, not scraped HTML) and
  # is an official, actively maintained package - worth the tradeoff of
  # needing an API key where ddg-mcp needed none.
  #
  # Freemium: free tier is 1,000 searches/month, no payment details needed
  # to obtain a key at https://app.tavily.com. Node/npm package, like
  # `filesystem` below - no Python equivalent, so no `--with mcp==1.9.4`
  # pin applies here (that gotcha is specific to the Python servers above).
  #
  # TAVILY_API_KEY is a secret and does not live in this file - it's read
  # from the process environment (.env.dev/.env.prod) via the ${VAR_NAME}
  # syntax `tool/adapters/mcp/config.py::_resolve_env` substitutes at load
  # time. Set TAVILY_API_KEY there before this server will start.
  #
  # Accuracy not yet measured against this repo's standard 3-trial table -
  # see tool-conventions.md "Servers evaluated" for the pending entry.
  command: npx
  args: ["-y", "tavily-mcp@latest"]
  env:
    TAVILY_API_KEY: "${TAVILY_API_KEY}"

filesystem:
  # The official Filesystem MCP server: read_file, read_multiple_files,
  # list_directory, directory_tree, search_files, get_file_info, plus
  # WRITE tools - write_file, edit_file, create_directory, move_file. Unlike
  # every other server in this file it's an npm package, not a uvx/PyPI one
  # (no Python equivalent exists), so it needs Node/npx instead of the
  # `--with mcp==1.9.4` uvx pin the others need - sanity-checked live and it
  # starts clean under the current npx/mcp SDK versions, no pin required.
  #
  # This is the same fetch-pairs-with-a-mutating-tool risk
  # .claude/rules/tool-conventions.md declined `git` and `workos` for:
  # `fetch` already pipes attacker-controlled web text into the model's
  # prompt, and this server's write tools give a prompt-injected turn a
  # path to write local files. There's no read-only flag to make the write
  # tools disappear from what's registered - the actual mitigation here is
  # the scoped directory below being a dedicated, empty, throwaway folder
  # with nothing of value in it, not tool filtering. Do not repoint this at
  # the repo, $HOME, or anything containing real data.
  #
  # The directory is a required env var, not a literal path, for the same
  # reason TAVILY_API_KEY above is: this file is committed and shared by
  # every clone, and a directory that's the sole boundary around a
  # write-capable, prompt-injection-reachable tool must not be one
  # developer's home-folder layout baked into it. `config.py::load_servers`
  # resolves `${VAR_NAME}` in `args` the same way it already does for `env`
  # values - an unset AGENT_FILES_DIR skips just this server, same as a
  # missing TAVILY_API_KEY skips just `tavily`. Set AGENT_FILES_DIR in
  # .env.dev/.env.prod to a dedicated, empty, throwaway directory before
  # this server will start.
  command: npx
  args: ["-y", "@modelcontextprotocol/server-filesystem", "${AGENT_FILES_DIR}"]

gmail:
  # Community/unofficial (@gongrzhe/server-gmail-autoauth-mcp, pinned
  # @1.1.11 - unlike the uvx/Python servers above, an npm publish carries
  # no equivalent of the `--with mcp==1.9.4` safety net, so an unpinned
  # `latest` here would silently change behavior on every process
  # restart) - no official Gmail MCP server is published by Google.
  # Full, exhaustive tool inventory (this file's convention per
  # .claude/rules/tool-conventions.md is to record what was actually
  # weighed, not an illustrative subset): send_email, draft_email,
  # read_email, search_emails, modify_email (labels), delete_email,
  # list_email_labels, create_label, update_label, delete_label,
  # batch_modify_emails, batch_delete_emails, and download_attachment -
  # full read+write, a deliberate choice made with the user (see
  # .claude/rules/tool-conventions.md "Gmail and Calendar").
  #
  # CRITICAL, KNOWINGLY ACCEPTED: send_email/draft_email take an
  # `attachments: string[]` of arbitrary local filesystem paths (read
  # from wherever this subprocess runs and attached to the outgoing
  # email), and download_attachment takes a `savePath` that defaults to
  # `process.cwd()` if omitted - confirmed by reading
  # @gongrzhe/server-gmail-autoauth-mcp@1.1.11's own dist/index.js, not
  # just its README. This server has no --enable-tools/whitelist flag
  # (confirmed: no such mechanism exists anywhere in its source) to
  # disable either at the config layer, unlike `calendar` below. Chained
  # with `fetch` (already piping attacker-controlled web text into the
  # model's prompt), this is a real, unscoped local-file-read-and-exfiltrate
  # primitive - worse than the risk `filesystem` above mitigates by
  # scoping to a throwaway AGENT_FILES_DIR, because there is no directory
  # to scope this to. This was NOT part of what "full read+write" meant in
  # the three questions this server was originally approved against - those
  # covered Gmail-API read/write (send/delete/modify email), not arbitrary
  # local file access. Surfaced separately and explicitly re-confirmed with
  # the user (see .claude/rules/tool-conventions.md "Gmail and Calendar"):
  # ship as-is, risk knowingly accepted. Revisit if this app ever gets
  # real, mutually-untrusted users, or if a fork/wrapper that strips
  # attachments/download_attachment becomes available.
  #
  # Single shared account, same as every other server in this file: this
  # is registered once, process-wide - there is no per-end-user Google
  # account. Every authenticated user of this app reaches the same Gmail
  # account. Do not point this at an account whose inbox matters if the
  # app has real, mutually-untrusted users.
  #
  # GMAIL_OAUTH_PATH / GMAIL_CREDENTIALS_PATH - undocumented in this
  # server's own README and its own "OAuth keys file not found" error
  # message (both only mention a fixed ~/.gmail-mcp/ location), but
  # present and read in dist/index.js - confirmed by reading the source.
  # Using them keeps this entry on this file's normal
  # ${VAR_NAME}-skips-only-this-server pattern (same as
  # GOOGLE_OAUTH_CREDENTIALS/TAVILY_API_KEY/AGENT_FILES_DIR) instead of a
  # host-fixed path this file can't express. One-time, host-side setup,
  # not something this file can do on the user's behalf:
  #   1. Google Cloud Console -> new/existing project -> enable the Gmail
  #      API -> OAuth consent screen -> Desktop app OAuth client -> download
  #      the client JSON.
  #   2. Set GMAIL_OAUTH_PATH in .env.dev/.env.prod to that downloaded
  #      file's path (GMAIL_CREDENTIALS_PATH, alongside it, is where the
  #      token this server caches after step 3 will be written - point it
  #      at a path in the same directory).
  #   3. Run `npx @gongrzhe/server-gmail-autoauth-mcp@1.1.11 auth` once, on
  #      the machine that runs this app's process, with both env vars set
  #      the same way - opens a browser consent flow, then caches a token
  #      at GMAIL_CREDENTIALS_PATH. This app's own process never sees the
  #      OAuth flow; it only spawns the server after that file exists.
  # An unset GMAIL_OAUTH_PATH skips this server at the config layer
  # (load_servers(), before any subprocess spawns) - same behavior as an
  # unset TAVILY_API_KEY/AGENT_FILES_DIR/GOOGLE_OAUTH_CREDENTIALS.
  command: npx
  args: ["-y", "@gongrzhe/server-gmail-autoauth-mcp@1.1.11"]
  env:
    GMAIL_OAUTH_PATH: "${GMAIL_OAUTH_PATH}"
    GMAIL_CREDENTIALS_PATH: "${GMAIL_CREDENTIALS_PATH}"

calendar:
  # Community/unofficial (@cocal/google-calendar-mcp, pinned @2.6.2 - see
  # `gmail` above for why an npm entry here carries a version pin the way
  # the uvx/Python servers get one via `--with mcp==1.9.4`; GitHub
  # nspady/google-calendar-mcp - the actively-maintained original many of
  # the other `google-calendar-mcp` npm listings are forks of, and its npm
  # publish is a GitHub Actions trusted-publish tied to that repo, unlike
  # the untraceable rest). No official Google-published Calendar MCP
  # server exists.
  #
  # --enable-tools below is a hard whitelist (confirmed in this server's
  # own --help output), not just documentation - it's what actually keeps
  # this server's registered surface to exactly the 8 tools this file and
  # .claude/rules/tool-conventions.md "Gmail and Calendar" document as
  # approved: list-calendars, list-events, search-events, get-event,
  # create-event, update-event, delete-event, get-freebusy. Two more this
  # server exposes are deliberately left off the whitelist:
  # manage-accounts (add/remove connected Google accounts - directly at
  # odds with the single-shared-account design below; an agent, or a
  # fetch-driven prompt injection, calling it could repoint or break the
  # configured account) and respond-to-event (RSVPs to invitations as the
  # shared account - a real-world action on someone else's calendar
  # invite, not part of what was scoped). list-colors and
  # get-current-time also exist upstream and are similarly left off since
  # neither was part of what was approved - list-colors adds nothing this
  # app's agent needs, and get-current-time duplicates the `time` server
  # already registered above. Full read+write on the 8 whitelisted tools
  # is still a deliberate choice, same as `gmail` above, same
  # single-shared-account scope as every other server in this file.
  #
  # Unlike gmail, this server takes its credential path as an env var
  # rather than a fixed location, so it follows this file's normal
  # ${VAR_NAME}-skips-only-this-server pattern (same as TAVILY_API_KEY/
  # AGENT_FILES_DIR above):
  #   1. Same Google Cloud OAuth client as gmail (a Calendar API-enabled
  #      Desktop app client works for both, or use a separate project -
  #      GOOGLE_OAUTH_CREDENTIALS may point at gmail's own
  #      GMAIL_OAUTH_PATH file rather than a second download).
  #   2. Set GOOGLE_OAUTH_CREDENTIALS in .env.dev/.env.prod to that file's
  #      path.
  #   3. Run `npx @cocal/google-calendar-mcp@2.6.2 auth` once, on the
  #      machine that runs this app's process, with GOOGLE_OAUTH_CREDENTIALS
  #      set the same way - opens a browser consent flow, caches a token
  #      next to the credentials file. Same as gmail, this app's process
  #      never sees the OAuth flow itself.
  # An unset GOOGLE_OAUTH_CREDENTIALS skips this server at the config layer
  # (load_servers(), before any subprocess spawns) - same behavior as an
  # unset TAVILY_API_KEY/AGENT_FILES_DIR.
  command: npx
  args:
    [
      "-y",
      "@cocal/google-calendar-mcp@2.6.2",
      "start",
      "--enable-tools",
      "list-calendars,list-events,search-events,get-event,create-event,update-event,delete-event,get-freebusy",
    ]
  env:
    GOOGLE_OAUTH_CREDENTIALS: "${GOOGLE_OAUTH_CREDENTIALS}"

# Two more servers were evaluated here and deliberately not enabled -
# sqlite (structured data) and git (repo awareness). Both connect fine and
# both answer real calls; the reasons they're off are measured, not
# assumed. See .claude/rules/tool-conventions.md ("Servers evaluated and
# not enabled") for the numbers and the exact args to turn either on.
