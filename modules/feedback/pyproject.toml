[project]
name = "feedback"
version = "0.1.0"
description = "Owner-scoped bug reports and product feedback, persisted in PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feedback"]
