[project]
name = "automation"
version = "0.1.0"
description = "Cron-scheduled unattended agent runs, persisted in PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "croniter>=2.0",
    "agent",
    "authentication",
    "chat",
]

# `shared` and `infrastructure` belong to the root ai-agent-platform project,
# not a separate workspace member - still importable here because uv
# resolves the whole workspace into a single shared environment (see the
# root pyproject.toml's [tool.uv.workspace]).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automation"]
