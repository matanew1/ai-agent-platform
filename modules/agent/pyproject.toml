[project]
name = "agent"
version = "0.1.0"
description = "Versioned, owner-scoped agent definitions and persisted session history, plus their public /agents API."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "tool",
    "authentication",
    "session",
]

# `shared` (cross-cutting types) belongs to the root ai-agent-platform
# project, not a separate workspace member - it's still importable here
# because uv resolves the whole workspace into a single shared environment
# (see the root pyproject.toml's [tool.uv.workspace]).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
