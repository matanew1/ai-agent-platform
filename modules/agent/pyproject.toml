[project]
name = "agent"
version = "0.1.0"
description = "Agent orchestration + public /agents API: LangGraph workflow, versioned agent definitions, and the ports both depend on."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "python-multipart>=0.0.32",
]

# `shared` (cross-cutting types) belongs to the root ai-agent-platform
# project, not a separate workspace member - it's still importable here
# because uv resolves the whole workspace into a single shared environment
# (see the root pyproject.toml's [tool.uv.workspace]).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
