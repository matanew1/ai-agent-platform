[project]
name = "session"
version = "0.1.0"
description = "Durable, cache-backed chat session-checkpoint persistence, shared by agent (session browsing) and chat (turn execution)."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
]

# `shared` and `infrastructure` are importable via the workspace's single
# environment - see modules/agent/pyproject.toml for the same note.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session"]
