[project]
name = "agents"
version = "0.1.0"
description = "Public customizable-agent definitions, scoped runtimes, and HTTP API."
requires-python = ">=3.12"
dependencies = [
    "agent",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "python-multipart>=0.0.32",
    "rag",
    "tool",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]
