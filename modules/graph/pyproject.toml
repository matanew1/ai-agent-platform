[project]
name = "graph"
version = "0.1.0"
description = "The LangGraph agent workflow: state, prompt templates, and the graph itself."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "rag",
    "tool",
]

# `shared` and `infrastructure` are importable via the workspace's single
# environment - see modules/agent/pyproject.toml for the same note.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph"]
