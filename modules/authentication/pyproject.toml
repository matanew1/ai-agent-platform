[project]
name = "authentication"
version = "0.1.0"
description = "Backend-owned WorkOS AuthKit session-cookie authentication: the /auth/* routes, the verified-caller FastAPI dependency, and its WorkOS/development implementations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "workos>=10.1,<11",
]

# `shared` (AuthenticatedUser, AuthenticationError) is importable via the
# workspace's single environment - see modules/agent/pyproject.toml for the
# same note.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authentication"]
