[project]
name = "authentication"
version = "0.1.0"
description = "Bearer JWT authentication: the verified-caller FastAPI dependency and its JWKS/development implementations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pyjwt[crypto]>=2.10,<3",
]

# `shared` (AuthenticatedUser, AuthenticationError) is importable via the
# workspace's single environment - see modules/agent/pyproject.toml for the
# same note.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authentication"]
