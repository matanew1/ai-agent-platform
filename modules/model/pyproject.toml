[project]
name = "model"
version = "0.1.0"
description = "Provider-aware model catalog and generation-defaults HTTP surface."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
]

# `infrastructure.llm.protocol.LanguageModelClient` and `shared` are
# importable via the workspace's single environment - see
# modules/agent/pyproject.toml for the same note.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model"]
