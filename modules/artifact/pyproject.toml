[project]
name = "artifact"
version = "0.1.0"
description = "Generated artifact storage and ownership access."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "fastapi>=0.115",
    "authentication",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifact"]
