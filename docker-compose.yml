services:
  mongodb:
    image: mongo:7
    container_name: ai-agent-platform-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-agent-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant ships its own web dashboard - no separate UI container needed.
  # Once this service is up: http://localhost:6333/dashboard
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-agent-platform-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # --- Local-dev-only admin UIs, not part of the app's runtime dependencies ---

  mongo-express:
    image: mongo-express:1
    container_name: ai-agent-platform-mongo-express
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false" # dev-only convenience, do not use in prod
    depends_on:
      mongodb:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ai-agent-platform-redis-commander
    ports:
      - "8083:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:
