[project]
name = "ai-agent-platform"
version = "0.12.1"
description = "Modular-monolith AI agent platform: FastAPI + LangGraph agent, RAG, and a local tool registry over PostgreSQL/Redis/Qdrant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=1.1",
    "ollama>=0.6",
    "qdrant-client>=1.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.1",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "agent",
    "rag",
    "tool",
    "artifact",
    "authentication",
    "model",
    "graph",
    "chat",
    "session",
    "platform-settings",
    "python-dotenv>=1.0",
    "alembic>=1.14",
]

# `uv run app` -> runs the entry point below (see app/main.py:run).
[project.scripts]
app = "app.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

# Workspace members are separately installable packages consumed by the
# root app via `tool.uv.sources` below, not published externally.
[tool.uv.workspace]
members = ["modules/*"]

[tool.uv.sources]
agent = { workspace = true }
rag = { workspace = true }
tool = { workspace = true }
artifact = { workspace = true }
authentication = { workspace = true }
model = { workspace = true }
graph = { workspace = true }
chat = { workspace = true }
session = { workspace = true }
platform-settings = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The root package itself only ships app/, infrastructure/, and shared/ -
# module business logic lives in the workspace members under modules/*.
[tool.hatch.build.targets.wheel]
packages = ["app", "infrastructure", "shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
